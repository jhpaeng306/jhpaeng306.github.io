        summary: "Advisor: Prof. Ernest K. Ryu"
        highlights:
          - Asymptotic behavior of randomized coordinate fixed-point iterations (RC-FPI) without fixed points.
          - Proved almost sure convergence of the normalized iterate using the Robbins–Siegmund quasi-martingale theorem.
          - Discovered a tight upper bound on the limit supremum of the variance of the normalized iterate.
          - Developed an infeasibility detection method for randomized FPI-type algorithms and extended the result to general M-norms (e.g. decentralized optimization solvers).

