        summary: "Advisor: Prof. Sunghoon Jung"
        highlights:
          - Quantum teleportation with quantum information theory. Described a necessary condition of generalized quantum teleportation in the language of quantum entropy; reviewed prior work on fidelity estimation and teleportation with non-maximally entangled qubits.

      - company: HYKE Research Group, Department of Mathematics, SNU
        position: Undergraduate researcher
        location: Seoul, Korea
        start_date: 2021-03-01
        end_date: 2021-12-31
        summary: "Advisor: Prof. Seung-Yeal Ha"
        highlights:
          - Application of the renormalization group method on the Lohe sphere model. Proved that the completely synchronized state among particles with identical natural frequencies forms a stable manifold; developed lemmas on the integration of matrix exponentials via Jordan form. 2021 Undergraduate Research Program, SNU Faculty of Liberal Education.
          - Estimation of the spectral density function using the maximum entropy rate. Reviewed AR(p) processes and their spectral density; covered Burg's theorem and its application to spectral estimation. Spring 2021 Undergraduate Research Internship, SNU College of Natural Sciences.

      - company: NCIA (Numerical Computing & Image Analysis Lab), Department of Mathematics, SNU
