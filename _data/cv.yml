# -----------------------------------------------------------------------------
# CV page content (rendered at /cv/ by the al_folio_cv plugin).
#
# How it renders:
#   - "Contact Information" comes from name / label / email / location.
#   - Every key under `sections:` becomes a card with that title, in the order listed here,
#     except that `Experience` and `Volunteer` are merged into one "Experience" card and
#     sorted by date automatically.
#   - Section titles that get special formatting: Education, Experience, Volunteer, Awards,
#     Publications, Skills, Languages, Interests, Certificates, Projects, References.
#   - Any OTHER title (e.g. "Teaching", "Activities") is a generic list: each entry is either
#       - label: Bold text
#         details: plain text after the colon
#     or
#       - bullet: a bullet line (Markdown allowed)
#   - Dates: use YYYY or YYYY-MM-DD; only the year is displayed. Omit end_date for "Present".
# -----------------------------------------------------------------------------

